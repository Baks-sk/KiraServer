<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie | Kira Server</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="../index.html" class="logo">Kira Server</a>
    <div class="nav-links">
      <a href="../index.html">Domů</a>
      <label class="switch-container" title="Přepnout vzhled">
        <input type="checkbox" id="themeToggle">
        <i class="fas fa-moon"></i>
      </label>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero-section">
    <div class="hero-content">
      <h1>Galerie</h1>
      <p class="subtitle">
        Omlouváme se, ale galerie je momentálně ve vývoji.<br>
        Brzy bude hotová 🛠️
      </p>
      <div class="cta-buttons">
        <a href="../index.html" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Zpět na Home
        </a>
      </div>
    </div>
  </header>

  <!-- FOOTER -->
  <footer>
    <p>
      &copy; <span id="year"></span> Kira Server. Vytvořeno pro naši komunitu. <br>
      <span style="font-size: 0.8rem; opacity: 0.6;">Nejsme spojeni s Mojang Studios.</span>
    </p>
  </footer>

  <script>
    // Rok do footeru
    document.getElementById('year').textContent = new Date().getFullYear();

    // Dark/light toggle
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme');

    if(savedTheme === 'dark') {
      body.classList.add('dark');
      themeToggle.checked = true;
    }

    themeToggle.addEventListener('change', () => {
      if(themeToggle.checked){
        body.classList.add('dark');
        localStorage.setItem('theme','dark');
      } else {
        body.classList.remove('dark');
        localStorage.setItem('theme','light');
      }
    });
  </script>

</body>
</html>
